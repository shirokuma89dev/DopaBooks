<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141619">
<title>DopaBooks</title>
<link rel="stylesheet" href="styles.css">
<main>
<div id="scene" aria-hidden="true"></div>
<header><strong>DopaBooks</strong><nav aria-label="作品"><select id="works" aria-label="作品を切り替える"></select></nav></header>
<section id="reader" aria-label="本文"><div id="track"></div></section>
<footer>
<div class="reading-stats"><span id="position"><span id="position-old" aria-hidden="true"></span><span id="position-number"></span></span><button id="recap" type="button" aria-haspopup="dialog" aria-controls="recap-dialog"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4h8M4 8h8M4 12h5"/></svg>あらすじ</button></div>
<div id="progress" role="progressbar" aria-label="この区切りの読書進捗" aria-valuemin="0"><div id="progressFill"></div></div>
<nav aria-label="読書操作"><button id="next" aria-label="次の文"><span id="next-label">← あと一文だけ♡</span></button><button id="prev" aria-label="前の文">→</button></nav>
</footer>
</main>
<dialog id="recap-dialog" aria-labelledby="recap-title">
<h2 id="recap-title">ここまでのあらすじ</h2>
<p id="recap-text"></p>
<form method="dialog"><button autofocus>読書に戻る</button></form>
</dialog>
<dialog id="finish" aria-labelledby="finish-title">
<h2 id="finish-title">読了おめでとう！</h2>
<p id="finish-joke"></p>
<p id="finish-count"></p>
<form method="dialog"><a id="finish-share" target="_blank" rel="noopener noreferrer">Xで共有</a><button autofocus>閉じる</button></form>
</dialog>
<script src="books.js"></script>
<script src="reader.js"></script>
</html>
